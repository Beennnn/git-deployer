name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck run.sh
        run: shellcheck -s bash git-deployer/root/run.sh || true
      - name: yamllint (config/build/repository)
        run: |
          pip install yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' \
            git-deployer/config.yaml git-deployer/build.yaml repository.yaml
      - name: hadolint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: git-deployer/Dockerfile
          failure-threshold: error

  # Pilote le VRAI run.sh sur un dépôt jetable, `bashio` et l'API HA simulés — aucune
  # instance Home Assistant requise, donc ça tourne sur un runner nu.
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: base de comparaison = SHA appliqué, pas SHA fetché
        run: bash tests/test_base_deployed_sha.sh
      - name: redémarrage HA sur déploiement REST
        run: bash tests/test_restart_on_rest.sh
      - name: déclencheur « passe maintenant »
        run: bash tests/test_run_now_trigger.sh
      - name: indirection « !secret » vers secrets.yaml
        run: bash tests/test_secret_indirection.sh
