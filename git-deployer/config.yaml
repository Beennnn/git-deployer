name: Git Deployer (git → HA)
version: "0.1.0-alpha.14"
slug: git-deployer
image: "ghcr.io/beennnn/git-deployer-{arch}"
description: >-
  Applique une branche git sur /config — le pendant « déploie » de git-exporter.
  Garde anti-écrasement, backup, check_config + rollback, reload ciblé.
  Publie deployed_sha (anti-course exporter/deployer) + compte-rendu deploy-status.
url: https://github.com/Beennnn/git-deployer
stage: experimental
arch:
  - aarch64
  - amd64
startup: once
# boot: auto — l'addon doit se relancer après un reboot HA. En boot:manual il restait éteint
# (loop de déploiement silencieuse jusqu'au prochain démarrage manuel) → le watchdog criait à
# juste titre « silencieux » à chaque reboot. NB : pour une install DÉJÀ en place, ce défaut ne
# suffit pas — il faut aussi basculer « Démarrer au démarrage » côté Superviseur (start_on_boot).
boot: auto
init: false
hassio_api: true
hassio_role: manager
homeassistant_api: true
map:
  - config:rw
options:
  repository:
    url: ""
    username: ""
    password: ""
    branch: main
  deploy:
    subdir: config
    dry_run: false
    allow_partial: false
    backup_before: true
    interval: 0
    # L'intégration `rest` ne se recharge pas (core#93527) : sans redémarrage, un
    # déploiement de rest.yaml est un no-op silencieux. Borné par restart_min_interval
    # (secondes) pour qu'une boucle courte ne redémarre pas HA à répétition ; un
    # redémarrage empêché par cette borne est mémorisé, pas perdu.
    restart_on_rest: true
    restart_min_interval: 3600
schema:
  repository:
    url: match(https://.*)
    username: str
    password: password
    branch: str
  deploy:
    subdir: str
    dry_run: bool
    allow_partial: bool
    backup_before: bool
    interval: int
    restart_on_rest: bool
    restart_min_interval: int
